<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Captura todos os parâmetros da URL e redireciona para of.html
        const urlParams = window.location.search;
        window.location.href = "of.html" + urlParams;
    </script>
    <meta http-equiv="refresh" content="0; url=of.html">
</head>
<body>
    <p>A redirecionar...</p>
</body>
</html>
