<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Confirmado - TikTok Rewards</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .thank-you-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: #f0fdf4;
      color: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    p {
      font-size: 16px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .details-box {
      background: #f8fafc;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .detail-item:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      color: #94a3b8;
    }

    .detail-value {
      color: #1e293b;
      font-weight: 600;
    }

    .btn-final {
      display: block;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      padding: 18px;
      border-radius: 12px;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .btn-final:hover {
      transform: scale(1.02);
      background: #1a1a1a;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="thank-you-card">
    <div class="success-icon">✓</div>
    <h1>Obrigado!</h1>
    <p>O seu perfil foi verificado com sucesso e o levantamento está agora em processamento final.</p>

    <div class="details-box">
      <div class="detail-item">
        <span class="detail-label">Estado:</span>
        <span class="detail-value" style="color: #22c55e;">Aprovado</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Tempo Estimado:</span>
        <span class="detail-value">3 - 10 minutos</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Protocolo:</span>
        <span class="detail-value">#TK-878-PT</span>
      </div>
    </div>

    <a href="https://www.tiktok.com" class="btn-final">Voltar para o TikTok</a>

    <div class="footer-text">
      Irá receber uma notificação assim que o valor for creditado na sua conta.
    </div>
  </div>

</body>

</html>
